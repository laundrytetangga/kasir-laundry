<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d7a6c"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kasir Laundry"><title>Kasir Laundry Tetangga</title>
<style>
:root{--g:#1d7a6c;--g2:#4aa89a;--y:#f5c518;--bg:#f3f7f6;--tx:#17302b;--mu:#6b7f7a;--ln:#d9e4e1;--rd:#c0392b}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:76px}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--y)}
header b{font-size:17px}header small{opacity:.85}
main{max-width:520px;margin:0 auto;padding:14px}
h2{margin:4px 0 12px;font-size:19px}
input,select,button,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:8px;background:#fff;color:var(--tx)}
input,select{margin-bottom:8px}
button{width:auto;cursor:pointer;background:#fff;border-color:var(--g);color:var(--g);font-weight:600}
button.pri{background:var(--g);color:#fff;width:100%;padding:14px;font-size:16px}
button.dng{border-color:var(--rd);color:var(--rd)}button.on{background:var(--g);color:#fff}
button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}.row>button{flex:0 0 auto}
.card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.li:last-child{border:0}.mu{color:var(--mu);font-size:13px}.r{text-align:right}
.tot{display:flex;justify-content:space-between;font-size:18px;margin:10px 0;font-weight:700}
.bd{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#e3efec;color:var(--g);margin-right:4px}
.bd.w{background:#fdf1c9;color:#7a5d00}.bd.x{background:#f8dcd8;color:var(--rd)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;padding:14px 4px;color:var(--mu)}nav button.on{background:#fff;color:var(--g);box-shadow:inset 0 3px var(--y)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.grid b{font-size:19px;display:block}
.wide{grid-column:span 2}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}
#modal>div{background:#fff;width:100%;max-width:520px;margin:0 auto;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
#modal canvas{width:100%;max-width:340px;display:block;margin:0 auto 10px;border:1px solid var(--ln)}
#pay button,#mbox .row button{font-size:14px;padding:11px 6px}
.res{padding:0;max-height:230px;overflow:auto}.res div{display:flex;justify-content:space-between;gap:8px;padding:11px 12px;border-bottom:1px solid var(--ln);cursor:pointer}.res div:active{background:#e3efec}
#bb{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));background:#fff;border-top:2px solid var(--y);padding:8px 10px;z-index:5;max-width:520px;margin:0 auto}#bb button{font-size:13px;padding:10px 4px;margin-top:6px}
body.bulk{padding-bottom:250px}
button,a,[data-i]{touch-action:manipulation;-webkit-tap-highlight-color:#1d7a6c22}button:active{transform:scale(.97);opacity:.85}
#ld{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--y),var(--g2),var(--y));background-size:200% 100%;animation:ld 1s linear infinite;z-index:100;display:none}@keyframes ld{to{background-position:-200% 0}}
#wait{position:fixed;inset:0;background:#fff8;display:none;align-items:center;justify-content:center;z-index:98;font-weight:600;color:var(--g)}#wait span{background:#fff;padding:12px 22px;border-radius:99px;box-shadow:0 2px 14px #0003}
#rg .row button{flex:1;font-size:13px;padding:9px 4px}
.hero{background:linear-gradient(135deg,#1d7a6c,#4aa89a);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-36px;top:-36px;width:110px;height:110px;border-radius:50%;background:var(--y);opacity:.85}
.hero>*{position:relative;z-index:1;display:block}.hero span,.hero small{opacity:.92}.hero b{font-size:30px;margin:2px 0}
.mini,.tiles,.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini{margin-bottom:12px}
.mini>div{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:10px 4px;text-align:center}.mini i{font-style:normal;font-size:22px;display:block}.mini b{font-size:18px;display:block}.mini span{font-size:12px;color:var(--mu)}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:150px;margin-top:10px}.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}.bc small{font-size:10px;color:var(--mu)}
.bar{width:100%;max-width:34px;background:var(--g2);border-radius:6px 6px 2px 2px}.bar.now{background:var(--y)}
.trio{margin:10px 0}.trio span{font-size:12px;color:var(--mu);display:block}.trio b{font-size:15px}.g{color:var(--g)}.r2{color:var(--rd)}
.pg{height:8px;background:#e3efec;border-radius:99px;overflow:hidden;margin-bottom:6px}.pg div{height:100%;background:linear-gradient(90deg,var(--y),#e67e22)}
.tiles button{display:flex;flex-direction:column;align-items:center;padding:12px 4px;border-radius:12px;border:0;font-weight:400;color:var(--tx)}.tiles b{font-size:22px}.tiles span{font-size:12px}.tiles small{font-size:11px}
.t1{background:#fdf1c9}.t2{background:#dcecf7}.t3{background:#f8dcd8}
#upd{position:fixed;left:10px;right:10px;top:10px;z-index:97;background:#17302b;color:#fff;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 2px 12px #0005}#upd button{padding:6px 14px;width:auto}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#17302b;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99;max-width:90%}
#login{max-width:340px;margin:20vh auto;text-align:center;padding:0 16px}#login img{width:200px}
.hide{display:none!important}
</style></head><body>

<div id="login"><img src="logo.png" alt="Laundry Tetangga"><h2>Masuk</h2>
<input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
<button class="pri" id="go">Masuk</button><button id="inst" class="hide" style="width:100%;margin-top:10px">Pasang sebagai aplikasi</button></div>

<div id="app" class="hide">
<header><div><b>Laundry Tetangga</b><br><small id="who"></small></div><div class="row" style="flex:0 0 auto;gap:6px"><button id="pr" style="padding:6px 12px;background:none;color:#fff;border-color:#fff8">Printer</button><button id="out" style="padding:6px 12px;background:none;color:#fff;border-color:#fff8">Keluar</button></div></header>
<main>
 <section id="v-dash" class="hide"><h2>Ringkasan</h2><div id="dash"></div></section>

 <section id="v-nota" class="hide"><h2>Daftar nota</h2>
  <input id="q" placeholder="Cari nama, nomor nota, atau WA">
  <select id="fs"><option value="">Semua nota</option><option value="aktif">Belum diambil</option><option value="belumlunas">Belum lunas</option><option value="diambilbelumbayar">Diambil, belum bayar</option><option value="Diambil">Sudah diambil</option></select>
  <div id="rg" class="hide"><div class="row" style="margin-bottom:8px"><button data-r="today">Hari ini</button><button data-r="month">Bulan ini</button><button data-r="last">Bulan lalu</button><button data-r="all">Semua</button></div>
  <div class="row"><input id="d1" type="date" aria-label="Dari tanggal"><input id="d2" type="date" aria-label="Sampai tanggal"></div><div id="sm" class="mu" style="margin-bottom:8px"></div></div>
  <button id="bm" class="hide" style="width:100%;margin-bottom:8px">Pilih banyak nota</button>
  <div id="list"></div></section>

 <section id="v-order" class="hide"><h2 id="ot">Order baru</h2>
  <div class="row" style="align-items:flex-start"><input id="nama" placeholder="Nama pelanggan" autocapitalize="characters"><button id="kon" class="hide" style="margin-bottom:8px">Kontak</button></div>
  <input id="wa" type="tel" inputmode="tel" placeholder="No. WA (08xxxxxxxxxx)">
  <input id="ls" placeholder="Cari layanan (contoh: express, jaket, sepatu)" autocomplete="off">
  <div id="lr" class="card res hide"></div>
  <div class="row"><input id="qty" type="number" step="0.1" min="0" inputmode="decimal" placeholder="Jumlah"><button id="add" style="margin-bottom:8px">Tambah</button></div>
  <div id="items" class="card hide"></div>
  <input id="ket" placeholder="Keterangan (opsional)">
  <div class="card"><div class="mu" style="margin-bottom:6px">Pembayaran</div><div class="row" id="pay"><button data-p="Belum" class="on">Belum bayar</button><button data-p="Cash">Lunas Cash</button><button data-p="QRIS">Lunas QRIS</button></div></div>
  <div class="tot"><span>Total</span><span id="tot">Rp0</span></div>
  <button class="pri" id="save">Simpan order</button>
  <button id="cancel" class="hide" style="width:100%;margin-top:8px">Batalkan ralat</button></section>

 <section id="v-keluar" class="hide"><h2>Pengeluaran</h2>
  <div class="card"><select id="kk"><option value="">Pilih kategori</option></select>
  <input id="kd" placeholder="Keterangan (opsional)"><input id="kj" type="text" inputmode="numeric" placeholder="Jumlah (Rp)">
  <input id="kt" type="date"><button class="pri" id="ksave">Catat pengeluaran</button></div>
  <div class="tot"><span>Bulan ini</span><span id="ktot"></span></div><div id="kper" class="card hide"></div><div id="klist"></div></section>
<section id="v-kas" class="hide"><h2>Tutup kas harian</h2><input id="ktg" type="date"><div id="kasbox"></div></section>
</main>
<div id="bb" class="hide"><div class="mu" id="bi"></div>
 <div class="row"><button data-k="s:Diambil">Diambil</button><button data-k="b:Cash">Lunas Cash</button><button data-k="b:QRIS">Lunas QRIS</button></div>
 <div class="row"><button data-k="a:Cash">Diambil + Cash</button><button data-k="a:QRIS">Diambil + QRIS</button></div>
 <div class="row"><button data-k="d:" id="bdel" class="dng">Hapus</button><button data-k="p:" id="bpul" class="hide">Pulihkan</button><button data-k="all">Pilih semua</button><button data-k="x">Batal</button></div></div>
<nav id="nav"></nav></div>

<div id="modal"><div id="mbox"></div></div><div id="upd" class="hide"><span>Versi baru tersedia</span><button id="updb">Perbarui</button></div><div id="ld"></div><div id="wait"><span>Memproses...</span></div><div id="toast"></div>

<script>
// ====== PENGATURAN ======
const VERSI='1.1-pwa';
const CFG={
 api:'https://script.google.com/macros/s/AKfycbwXG7HX7EUGX1fY13ixfxJi-E0yiyT-WcefVpwn_h6TIIMJbu-5QYg_C2uAMUyGyKEb/exec',
 alamat:'Gang Ratna, Jl. Sedap Malam',wa:'WA 0859-6265-4475',tagline:'Gratis antar jemput - Sesama tetangga',
 komplain:'Komplain pakaian hanya berlaku jika pakaian diambil maksimal 2 hari setelah selesai diproses, dan dikomplain maksimal 1 hari setelah pakaian diterima pelanggan dan dibuka. Di luar ketentuan tersebut, komplain tidak dapat diproses.',
 saran:'Kritik, saran, dan masukan terbuka kapan saja melalui WhatsApp Laundry Tetangga.',
 tutup1:'Jangan biarkan CUCIAN BERAT bikin harimu CAPEK, serahkan saja semuanya ke KAMI.',
 tutup2:'Terima kasih sudah berlangganan di Laundry Tetangga! 🥰',
 pesanBayar:'Untuk pembayarannya bebas ya Kak, bisa cash atau scan QRIS yang ada di album profil WA kami (kalau pakai QRIS, jangan lupa kirim bukti transfernya ya 📲✅).',
 pesanInfo:'📌 Sekadar info tambahan ya Kak:\n\n* Laundry yang masuk di atas jam 17.00 akan diproses besok di jam kerja (08.00–17.00).\n* Untuk layanan antar-jemput 🛵, mohon info maksimal H-1 atau sebelum jam pengantaran (Pagi: 07.00–08.00 | Malam: 19.00–20.00). Di luar jam tersebut belum bisa kami layani, dan jarak di atas 1 km akan dikenakan biaya tambahan.',
 pesanTutup:'Mohon maaf jika chat di luar jam operasional agak slow response 🙇‍♂️, tapi pasti segera kami balas. Terima kasih banyak sudah laundry di tempat kami, Kak! 🙏✨'
};
const $=id=>document.getElementById(id);
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const num=n=>String(n).replace('.',',');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PIN=localStorage.getItem('pin')||'',USER=null,LAY=[],ITEMS=[],EDIT=null,TAB='',LASTKET='',PAY='Belum',SEL=null,BULK=false,SELS={},KAT=[],KROWS=[],WP=0,PEND=0;
const LOGO=new Image(),LOGOP=new Image();LOGO.src='logo.png';LOGOP.src='logo_print.png';

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3500)}
const RD=['login','layanan','pengaturan','pesanan','detail','dashboard','pengeluaran','kasHari'];
async function api(action,data){
 const w=RD.indexOf(action)<0;PEND++;$('ld').style.display='block';if(w){WP++;$('wait').style.display='flex'}
 try{const r=await fetch(CFG.api,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action,pin:PIN},data))});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Gagal');return j}
 finally{if(!--PEND)$('ld').style.display='none';if(w&&!--WP)$('wait').style.display='none'}}
function modal(h){$('mbox').innerHTML=h;$('modal').style.display='flex'}
function closeModal(){$('modal').style.display='none'}
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};

// ====== LOGIN & NAVIGASI ======
async function login(){
 try{const [j,ly,pg]=await Promise.all([api('login'),api('layanan'),api('pengaturan').catch(()=>({data:{}}))]);USER=j.user;localStorage.setItem('pin',PIN);LAY=ly.data;Object.keys(pg.data).forEach(k=>{if(k!=='api')CFG[k]=pg.data[k]});
  $('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=USER.nama;
  const tabs=USER.role==='owner'?[['dash','Ringkasan'],['nota','Nota'],['order','Order'],['keluar','Pengeluaran'],['kas','Kas']]:[['order','Order'],['nota','Nota']];
  $('nav').innerHTML=tabs.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
  $('nav').onclick=e=>e.target.dataset.t&&show(e.target.dataset.t);
  if(USER.role==='owner'){$('bm').classList.remove('hide');$('rg').classList.remove('hide')}fillLay();show(tabs[0][0]);
 }catch(e){PIN='';toast(e.message==='Failed to fetch'?'Tidak bisa terhubung. Cek internet dan URL API.':e.message)}}
$('go').onclick=()=>{PIN=$('pin').value.trim();login()};
$('out').onclick=()=>{localStorage.removeItem('pin');location.reload()};
function show(t){TAB=t;if(t!=='nota'&&BULK)setBulk(false);['dash','nota','order','keluar','kas'].forEach(x=>$('v-'+x).classList.toggle('hide',x!==t));
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 if(t==='dash')loadDash();if(t==='nota')loadList();if(t==='keluar')loadKeluar();if(t==='kas')loadKas()}
setInterval(()=>{if(!USER||document.hidden||$('modal').style.display==='flex')return;
 if(TAB==='dash')loadDash();if(TAB==='nota'&&!BULK&&document.activeElement.id!=='q')loadList()},30000);

// ====== ORDER ======
function fillLay(){SEL=null;$('ls').value='';$('lr').classList.add('hide')}
function showRes(){const q=$('ls').value.toLowerCase().split(/\s+/).filter(Boolean);
 const r=LAY.map((l,i)=>[l,i]).filter(a=>q.every(w=>a[0].nama.toLowerCase().includes(w)));
 $('lr').innerHTML=r.length?r.map(a=>`<div data-i="${a[1]}"><span>${esc(a[0].nama)}</span><span class="mu">${rp(a[0].harga)}/${a[0].satuan}</span></div>`).join(''):'<div class="mu">Layanan tidak ditemukan</div>';
 $('lr').classList.remove('hide')}
$('ls').oninput=()=>{SEL=null;showRes()};$('ls').onfocus=showRes;
$('lr').onclick=e=>{const d=e.target.closest('[data-i]');if(!d)return;SEL=+d.dataset.i;const l=LAY[SEL];
 $('ls').value=l.nama;$('lr').classList.add('hide');$('qty').placeholder='Jumlah ('+l.satuan+')';$('qty').focus()};
$('add').onclick=()=>{const l=LAY[SEL],q=parseFloat(String($('qty').value).replace(',','.'));
 if(!l)return toast('Pilih layanan dulu dari hasil pencarian');if(!(q>0))return toast('Isi jumlah lebih dari 0');
 ITEMS.push({layanan:l.nama,jenis:l.jenis,satuan:l.satuan,harga:l.harga,qty:q});$('qty').value='';fillLay();$('qty').placeholder='Jumlah';drawItems();$('ls').focus()};
// kontak HP
if('contacts' in navigator&&'ContactsManager' in window)$('kon').classList.remove('hide');
$('kon').onclick=async()=>{try{const c=await navigator.contacts.select(['name','tel'],{multiple:false});if(!c.length)return;
 if(c[0].name&&c[0].name[0])$('nama').value=c[0].name[0].toUpperCase();
 if(c[0].tel&&c[0].tel[0]){let t=c[0].tel[0].replace(/[^\d+]/g,'');if(t.startsWith('+62'))t='0'+t.slice(3);else if(t.startsWith('62'))t='0'+t.slice(2);$('wa').value=t}
 }catch(e){toast('Kontak gagal ('+(e.name||'error')+'). Izinkan akses Kontak untuk Chrome di Pengaturan HP.')}};
// pembayaran
function drawPay(){document.querySelectorAll('#pay button').forEach(b=>b.classList.toggle('on',b.dataset.p===PAY))}
$('pay').onclick=e=>{if(e.target.dataset.p){PAY=e.target.dataset.p;drawPay()}};
function drawItems(){const b=$('items');b.classList.toggle('hide',!ITEMS.length);
 b.innerHTML=ITEMS.map((i,k)=>`<div class="li"><div>${esc(i.layanan)}<div class="mu">${num(i.qty)} ${i.satuan} x ${rp(i.harga)}</div></div><div class="r">${rp(Math.round(i.qty*i.harga))}<br><a href="#" data-d="${k}" style="color:var(--rd)">hapus</a></div></div>`).join('');
 $('tot').textContent=rp(ITEMS.reduce((t,i)=>t+Math.round(i.qty*i.harga),0))}
$('items').onclick=e=>{if(e.target.dataset.d){e.preventDefault();ITEMS.splice(+e.target.dataset.d,1);drawItems()}};
function resetForm(){ITEMS=[];EDIT=null;PAY='Belum';drawPay();fillLay();['nama','wa','ket'].forEach(i=>$(i).value='');$('ot').textContent='Order baru';
 $('save').textContent='Simpan order';$('cancel').classList.add('hide');drawItems()}
$('cancel').onclick=resetForm;
$('save').onclick=async()=>{
 const nama=$('nama').value.trim();if(!nama||!ITEMS.length)return toast('Isi nama dan minimal satu layanan');
 let alasan='';if(EDIT){alasan=(prompt('Alasan ralat (wajib):')||'').trim();if(!alasan)return toast('Alasan ralat wajib diisi')}
 const d={nama,wa:$('wa').value.trim(),keterangan:$('ket').value.trim(),bayar:PAY==='Belum'?'Belum':'Lunas',metode:PAY==='Belum'?'':PAY,items:ITEMS.map(i=>({layanan:i.layanan,qty:i.qty}))};
 $('save').disabled=true;
 try{const j=EDIT?await api('ralat',Object.assign(d,{noNota:EDIT,alasan})):await api('simpan',d);
  j.keterangan=d.keterangan;resetForm();showNota(j,true)}
 catch(e){toast(e.message)}finally{$('save').disabled=false}};

// ====== DAFTAR NOTA ======
let T;$('q').oninput=()=>{clearTimeout(T);T=setTimeout(loadList,400)};$('fs').onchange=loadList;
async function loadList(){
 if(USER.role==='owner'&&!$('fs').querySelector('[value=Dihapus]'))$('fs').insertAdjacentHTML('beforeend','<option value="Dihapus">Dihapus</option>');
 try{$('list')._rows=(await api('pesanan',{q:$('q').value.trim(),status:$('fs').value,dari:$('d1').value,sampai:$('d2').value})).data;renderList();bulkInfo()}catch(e){toast(e.message)}}
function renderList(){const rows=$('list')._rows||[];
 if(USER&&USER.role==='owner'){const tot=rows.reduce((t,r)=>t+r.total,0),ln=rows.filter(r=>r.bayar==='Lunas').reduce((t,r)=>t+r.total,0);
  $('sm').textContent=$('fs').value==='Dihapus'?rows.length+' nota dihapus':rows.length+' nota - total '+rp(tot)+' - lunas '+rp(ln)}
 $('list').innerHTML=rows.length?rows.map((r,i)=>{const on=BULK&&SELS[r.noNota];
  return `<div class="card" data-i="${i}" style="cursor:pointer${on?';border-color:var(--g);background:#eaf4f1':''}"><div class="row" style="align-items:center"><b>${BULK?(on?'&#9745; ':'&#9744; '):''}${esc(r.nama)}</b><b class="r">${rp(r.total)}</b></div>
   <div class="mu">${r.noNota} - ${r.tanggal}</div><div style="margin-top:4px"><span class="bd ${r.status==='Dihapus'?'x':''}">${stl(r.status)}</span><span class="bd ${r.bayar==='Lunas'?'':'w'}">${r.bayar==='Lunas'?'Lunas'+(r.metode?' '+r.metode:''):'Belum lunas'}</span></div></div>`}).join(''):'<p class="mu">Tidak ada nota.</p>'}

function estimasi(n){const m=/(\d+)\/(\d+)\/(\d+) (\d+):(\d+)/.exec(n.tanggal||'');if(!m||!n.items.length)return '-';
 const h=Math.max.apply(null,n.items.map(i=>jamLayanan(i.layanan))),d=new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]+h*60),p=v=>('0'+v).slice(-2);
 return HARI[d.getDay()]+', '+p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())}

function estDate(n){const m=/(\d+)\/(\d+)\/(\d+) (\d+):(\d+)/.exec(n.tanggal||'');if(!m||!n.items.length)return null;
 return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]+Math.max.apply(null,n.items.map(i=>jamLayanan(i.layanan)))*60)}
function estWA(n){const d=estDate(n),p=v=>('0'+v).slice(-2);return d?HARIF[d.getDay()]+', '+d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()+', pukul '+p(d.getHours())+':'+p(d.getMinutes()):'-'}

 const W=384,run=(cv)=>{const x=cv.getContext('2d');x.scale(s,s);x.fillStyle='#fff';x.fillRect(0,0,W,4000);x.fillStyle='#000';x.textBaseline='top';
  let y=6;const f=(z,b)=>x.font=(b?'700 ':'400 ')+z+'px system-ui,Roboto,Arial,sans-serif';
  const t=(a,px,al)=>{x.textAlign=al;x.fillText(a,px,y)};
  const wrap=(a,z,b,mw)=>{f(z,b);const o=[];let l='';a.split(' ').forEach(w=>{const c=l?l+' '+w:w;if(x.measureText(c).width>mw&&l){o.push(l);l=w}else l=c});o.push(l);return o};
  const mid=(a,z,b,lh)=>wrap(a,z,b,W-24).forEach(l=>{f(z,b);t(l,W/2,'center');y+=lh});
  const left=(a,z,b,lh)=>wrap(a,z,b,W-20).forEach(l=>{f(z,b);t(l,10,'left');y+=lh});
  const row=(l,r,z,b,lh)=>{f(z,b);t(l,10,'left');t(r,W-10,'right');y+=lh};
  const dash=()=>{y+=2;x.save();x.setLineDash([3,3]);x.lineWidth=1;x.strokeStyle='#000';x.beginPath();x.moveTo(10,y);x.lineTo(W-10,y);x.stroke();x.restore();y+=6};
  const numd=(k,a)=>{const ls=wrap(a,11,0,W-36);f(11,1);t(k+'.',10,'left');ls.forEach(l=>{f(11,0);t(l,25,'left');y+=14})};
  const L=pr?LOGOP:LOGO;if(L.complete&&L.naturalWidth){const lw=104;x.drawImage(L,(W-lw)/2,y,lw,lw);y+=lw+4}
  if(pr)mid(CFG.tagline,11,1,14);mid(CFG.alamat,14,1,18);mid(CFG.wa,14,1,18);y+=16;dash();
  row('No',n.noNota,12,0,16);row('Masuk',n.tanggal,12,0,16);row('Estimasi',estimasi(n),12,1,17);row('Nama',n.nama,15,1,20);
  if(n.keterangan)left('Ket: '+n.keterangan,12,0,15);dash();
  n.items.forEach((i,ix)=>{const sub=i.subtotal!=null?i.subtotal:Math.round(i.qty*i.harga);
   const nm=wrap(i.layanan,13,1,W-120);nm.forEach((l,k)=>{f(13,1);if(k===0)t((ix+1)+'.',10,'left');t(l,28,'left');if(k===0){t(Number(sub).toLocaleString('id-ID'),W-10,'right')}y+=16});
   f(11,0);t(num(i.qty)+' '+(i.satuan||'')+' x '+Number(i.harga).toLocaleString('id-ID'),28,'left');y+=14});
  dash();
  x.fillStyle='#000';x.fillRect(8,y,W-16,28);x.fillStyle='#fff';y+=4;f(17,1);t('TOTAL',16,'left');t(rp(n.total),W-16,'right');y+=24;x.fillStyle='#000';y+=8;
  const bt=n.bayar==='Lunas'?'LUNAS - '+(n.metode||'Cash').toUpperCase():'BELUM LUNAS';
  f(13,1);t('Bayar',10,'left');const bw=x.measureText(bt).width+16;x.lineWidth=1.5;x.strokeStyle='#000';x.strokeRect(W-10-bw,y-3,bw,22);t(bt,W-18,'right');y+=26;
  dash();

  y+=16;
  mid(CFG.tutup1,12,1,16);y+=8;mid(CFG.tutup2,12,1,16);return y+8};
 const tmp=document.createElement('canvas');tmp.width=W*s;tmp.height=4000*s;const H=Math.ceil(run(tmp));
 const cv=document.createElement('canvas');cv.width=W*s;cv.height=H*s;run(cv);return cv}

function rasterBytes(src){ // canvas -> ESC/POS (384 titik, 48 byte per baris)
 const W=384,H=Math.round(src.height*W/src.width),c=document.createElement('canvas');c.width=W;c.height=H;
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(src,0,0,W,H);
 const d=x.getImageData(0,0,W,H).data,wb=W/8,o=[0x1b,0x40];
 for(let y0=0;y0<H;y0+=128){const hh=Math.min(128,H-y0);o.push(0x1d,0x76,0x30,0,wb&255,wb>>8,hh&255,hh>>8);
  for(let y=y0;y<y0+hh;y++)for(let b=0;b<wb;b++){let v=0;for(let k=0;k<8;k++){const i=(y*W+b*8+k)*4;if(d[i]*.3+d[i+1]*.59+d[i+2]*.11<165)v|=0x80>>k}o.push(v)}}
 o.push(0x1b,0x64,2);return o}
// ===== Printer: RawBT atau Bluetooth langsung (BLE) =====
let PM=localStorage.getItem('pm')||'ble',BC=+(localStorage.getItem('bc')||20),BLE=null,LASTDEV=null;
const BSV=['000018f0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','0000fee7-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ae30-0000-1000-8000-00805f9b34fb'];
async function bleOpen(dev){
 const srv=await dev.gatt.connect();let ch=null,svs=[];
 try{svs=await srv.getPrimaryServices()}catch(e){}
 for(const sv of svs){for(const c of await sv.getCharacteristics()){if(c.properties.write||c.properties.writeWithoutResponse){ch=c;break}}if(ch)break}
 if(!ch){dev.gatt.disconnect();throw new Error('Jalur cetak Bluetooth LE tidak ditemukan di printer ini. Gunakan mode RawBT.')}
 if(!dev._l){dev._l=1;dev.addEventListener('gattserverdisconnected',()=>{BLE=null})}LASTDEV=dev;BLE={dev,ch};return ch}
async function bleConnect(){
 if(!navigator.bluetooth)throw new Error('Browser ini tidak mendukung Bluetooth langsung. Gunakan Chrome di Android.');
 if(BLE&&BLE.dev.gatt.connected)return BLE.ch;
 if(LASTDEV){try{return await bleOpen(LASTDEV)}catch(e){LASTDEV=null}}
 if(navigator.bluetooth.getDevices){try{const nm=localStorage.getItem('bd'),d=(await navigator.bluetooth.getDevices()).find(x=>x.name===nm);if(d)return await bleOpen(d)}catch(e){}}
 const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BSV});
 localStorage.setItem('bd',dev.name||'');return await bleOpen(dev)}
async function bleSend(bytes){const ch=await bleConnect(),a=Uint8Array.from(bytes);
 for(let i=0;i<a.length;i+=BC){const part=a.slice(i,i+BC);
  if(ch.properties.writeWithoutResponse)await ch.writeValueWithoutResponse(part);else await ch.writeValue(part);
  await new Promise(r=>setTimeout(r,BC>60?15:6))}}
function rawbt(bytes){let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.slice(i,i+8192));
 location.href='intent:base64,'+btoa(bin)+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;'}
async function kirimCetak(bytes){
 if(PM==='ble'){$('wait').style.display='flex';try{await bleSend(bytes);toast('Terkirim ke printer')}catch(e){if(e.name!=='NotFoundError')toast(e.message)}finally{$('wait').style.display='none'}return}
 rawbt(bytes)}
