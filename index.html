<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d7a6c"><title>Kasir Laundry Tetangga</title>
<style>
:root{--g:#1d7a6c;--g2:#4aa89a;--y:#f5c518;--bg:#f3f7f6;--tx:#17302b;--mu:#6b7f7a;--ln:#d9e4e1;--rd:#c0392b}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:76px}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--y)}
header b{font-size:17px}header small{opacity:.85}
main{max-width:520px;margin:0 auto;padding:14px}
h2{margin:4px 0 12px;font-size:19px}
input,select,button,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:8px;background:#fff;color:var(--tx)}
input,select{margin-bottom:8px}
button{width:auto;cursor:pointer;background:#fff;border-color:var(--g);color:var(--g);font-weight:600}
button.pri{background:var(--g);color:#fff;width:100%;padding:14px;font-size:16px}
button.dng{border-color:var(--rd);color:var(--rd)}button.on{background:var(--g);color:#fff}
button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}.row>button{flex:0 0 auto}
.card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.li:last-child{border:0}.mu{color:var(--mu);font-size:13px}.r{text-align:right}
.tot{display:flex;justify-content:space-between;font-size:18px;margin:10px 0;font-weight:700}
.bd{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#e3efec;color:var(--g);margin-right:4px}
.bd.w{background:#fdf1c9;color:#7a5d00}.bd.x{background:#f8dcd8;color:var(--rd)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;padding:14px 4px;color:var(--mu)}nav button.on{background:#fff;color:var(--g);box-shadow:inset 0 3px var(--y)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.grid b{font-size:19px;display:block}
.wide{grid-column:span 2}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}
#modal>div{background:#fff;width:100%;max-width:520px;margin:0 auto;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
#modal canvas{width:100%;max-width:340px;display:block;margin:0 auto 10px;border:1px solid var(--ln)}
#pay button,#mbox .row button{font-size:14px;padding:11px 6px}
.res{padding:0;max-height:230px;overflow:auto}.res div{display:flex;justify-content:space-between;gap:8px;padding:11px 12px;border-bottom:1px solid var(--ln);cursor:pointer}.res div:active{background:#e3efec}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#17302b;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99;max-width:90%}
#login{max-width:340px;margin:20vh auto;text-align:center;padding:0 16px}#login img{width:200px}
.hide{display:none!important}
</style></head><body>

<div id="login"><img src="logo.png" alt="Laundry Tetangga"><h2>Masuk</h2>
<input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
<button class="pri" id="go">Masuk</button></div>

<div id="app" class="hide">
<header><div><b>Laundry Tetangga</b><br><small id="who"></small></div><button id="out" style="padding:6px 12px;background:none;color:#fff;border-color:#fff8">Keluar</button></header>
<main>
 <section id="v-dash" class="hide"><h2>Ringkasan</h2><div id="dash" class="grid"></div></section>

 <section id="v-nota" class="hide"><h2>Daftar nota</h2>
  <input id="q" placeholder="Cari nama, nomor nota, atau WA">
  <select id="fs"><option value="">Semua nota</option><option value="aktif">Belum diambil</option><option>Selesai</option><option>Diambil</option></select>
  <div id="list"></div></section>

 <section id="v-order" class="hide"><h2 id="ot">Order baru</h2>
  <div class="row" style="align-items:flex-start"><input id="nama" placeholder="Nama pelanggan" autocapitalize="characters"><button id="kon" class="hide" style="margin-bottom:8px">Kontak</button></div>
  <input id="wa" type="tel" inputmode="tel" placeholder="No. WA (08xxxxxxxxxx)">
  <input id="ls" placeholder="Cari layanan (contoh: express, jaket, sepatu)" autocomplete="off">
  <div id="lr" class="card res hide"></div>
  <div class="row"><input id="qty" type="number" step="0.1" min="0" inputmode="decimal" placeholder="Jumlah"><button id="add" style="margin-bottom:8px">Tambah</button></div>
  <div id="items" class="card hide"></div>
  <input id="ket" placeholder="Keterangan (opsional)">
  <div class="card"><div class="mu" style="margin-bottom:6px">Pembayaran</div><div class="row" id="pay"><button data-p="Belum" class="on">Belum bayar</button><button data-p="Cash">Lunas Cash</button><button data-p="QRIS">Lunas QRIS</button></div></div>
  <div class="tot"><span>Total</span><span id="tot">Rp0</span></div>
  <button class="pri" id="save">Simpan dan cetak</button>
  <button id="cancel" class="hide" style="width:100%;margin-top:8px">Batalkan ralat</button></section>

 <section id="v-keluar" class="hide"><h2>Pengeluaran</h2>
  <div class="card"><input id="kk" list="kkl" placeholder="Kategori (listrik, deterjen, gaji...)"><datalist id="kkl"></datalist>
  <input id="kd" placeholder="Keterangan (opsional)"><input id="kj" type="number" inputmode="numeric" placeholder="Jumlah (Rp)">
  <input id="kt" type="date"><button class="pri" id="ksave">Catat pengeluaran</button></div>
  <div class="tot"><span>Bulan ini</span><span id="ktot"></span></div><div id="klist"></div></section>
</main>
<nav id="nav"></nav></div>

<div id="modal"><div id="mbox"></div></div><div id="toast"></div>

<script>
// ====== PENGATURAN ======
const CFG={
 api:'https://script.google.com/macros/s/AKfycbwXG7HX7EUGX1fY13ixfxJi-E0yiyT-WcefVpwn_h6TIIMJbu-5QYg_C2uAMUyGyKEb/exec',
 alamat:'Gang Ratna, Jl. Sedap Malam',wa:'WA 0859-6265-4475',tagline:'Gratis antar jemput - Sesama tetangga',
 komplain:'Komplain pakaian hanya berlaku jika pakaian diambil maksimal 2 hari setelah selesai diproses, dan dikomplain maksimal 1 hari setelah pakaian diterima pelanggan dan dibuka. Di luar ketentuan tersebut, komplain tidak dapat diproses.',
 saran:'Kritik, saran, dan masukan terbuka kapan saja melalui WhatsApp Laundry Tetangga.',
 tutup:'Jangan biarkan cucian berat bikin harimu capek, serahkan saja semuanya ke kami. Terima kasih sudah berlangganan di Laundry Tetangga!'
};
const $=id=>document.getElementById(id);
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const num=n=>String(n).replace('.',',');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PIN=localStorage.getItem('pin')||'',USER=null,LAY=[],ITEMS=[],EDIT=null,TAB='',LASTKET='',PAY='Belum',SEL=null;
const LOGO=new Image(),LOGOP=new Image();LOGO.src='logo.png';LOGOP.src='logo_print.png';

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3500)}
async function api(action,data){
 const r=await fetch(CFG.api,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action,pin:PIN},data))});
 const j=await r.json();if(!j.ok)throw new Error(j.error||'Gagal');return j}
function modal(h){$('mbox').innerHTML=h;$('modal').style.display='flex'}
function closeModal(){$('modal').style.display='none'}
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};

// ====== LOGIN & NAVIGASI ======
async function login(){
 try{const j=await api('login');USER=j.user;localStorage.setItem('pin',PIN);
  LAY=(await api('layanan')).data;
  $('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=USER.nama;
  const tabs=USER.role==='owner'?[['dash','Ringkasan'],['nota','Nota'],['order','Order'],['keluar','Pengeluaran']]:[['order','Order'],['nota','Nota']];
  $('nav').innerHTML=tabs.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
  $('nav').onclick=e=>e.target.dataset.t&&show(e.target.dataset.t);
  fillLay();show(tabs[0][0]);
 }catch(e){PIN='';toast(e.message==='Failed to fetch'?'Tidak bisa terhubung. Cek internet dan URL API.':e.message)}}
$('go').onclick=()=>{PIN=$('pin').value.trim();login()};
$('out').onclick=()=>{localStorage.removeItem('pin');location.reload()};
function show(t){TAB=t;['dash','nota','order','keluar'].forEach(x=>$('v-'+x).classList.toggle('hide',x!==t));
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 if(t==='dash')loadDash();if(t==='nota')loadList();if(t==='keluar')loadKeluar()}
setInterval(()=>{if(!USER||document.hidden||$('modal').style.display==='flex')return;
 if(TAB==='dash')loadDash();if(TAB==='nota'&&document.activeElement.id!=='q')loadList()},30000);

// ====== ORDER ======
function fillLay(){SEL=null;$('ls').value='';$('lr').classList.add('hide')}
function showRes(){const q=$('ls').value.toLowerCase().split(/\s+/).filter(Boolean);
 const r=LAY.map((l,i)=>[l,i]).filter(a=>q.every(w=>a[0].nama.toLowerCase().includes(w)));
 $('lr').innerHTML=r.length?r.map(a=>`<div data-i="${a[1]}"><span>${esc(a[0].nama)}</span><span class="mu">${rp(a[0].harga)}/${a[0].satuan}</span></div>`).join(''):'<div class="mu">Layanan tidak ditemukan</div>';
 $('lr').classList.remove('hide')}
$('ls').oninput=()=>{SEL=null;showRes()};$('ls').onfocus=showRes;
$('lr').onclick=e=>{const d=e.target.closest('[data-i]');if(!d)return;SEL=+d.dataset.i;const l=LAY[SEL];
 $('ls').value=l.nama;$('lr').classList.add('hide');$('qty').placeholder='Jumlah ('+l.satuan+')';$('qty').focus()};
$('add').onclick=()=>{const l=LAY[SEL],q=parseFloat(String($('qty').value).replace(',','.'));
 if(!l)return toast('Pilih layanan dulu dari hasil pencarian');if(!(q>0))return toast('Isi jumlah lebih dari 0');
 ITEMS.push({layanan:l.nama,jenis:l.jenis,satuan:l.satuan,harga:l.harga,qty:q});$('qty').value='';fillLay();$('qty').placeholder='Jumlah';drawItems();$('ls').focus()};
// kontak HP
if('contacts' in navigator&&'ContactsManager' in window)$('kon').classList.remove('hide');
$('kon').onclick=async()=>{try{const c=await navigator.contacts.select(['name','tel'],{multiple:false});if(!c.length)return;
 if(c[0].name&&c[0].name[0])$('nama').value=c[0].name[0].toUpperCase();
 if(c[0].tel&&c[0].tel[0]){let t=c[0].tel[0].replace(/[^\d+]/g,'');if(t.startsWith('+62'))t='0'+t.slice(3);else if(t.startsWith('62'))t='0'+t.slice(2);$('wa').value=t}
 }catch(e){toast('Kontak tidak bisa dibuka')}};
// pembayaran
function drawPay(){document.querySelectorAll('#pay button').forEach(b=>b.classList.toggle('on',b.dataset.p===PAY))}
$('pay').onclick=e=>{if(e.target.dataset.p){PAY=e.target.dataset.p;drawPay()}};
function drawItems(){const b=$('items');b.classList.toggle('hide',!ITEMS.length);
 b.innerHTML=ITEMS.map((i,k)=>`<div class="li"><div>${esc(i.layanan)}<div class="mu">${num(i.qty)} ${i.satuan} x ${rp(i.harga)}</div></div><div class="r">${rp(Math.round(i.qty*i.harga))}<br><a href="#" data-d="${k}" style="color:var(--rd)">hapus</a></div></div>`).join('');
 $('tot').textContent=rp(ITEMS.reduce((t,i)=>t+Math.round(i.qty*i.harga),0))}
$('items').onclick=e=>{if(e.target.dataset.d){e.preventDefault();ITEMS.splice(+e.target.dataset.d,1);drawItems()}};
function resetForm(){ITEMS=[];EDIT=null;PAY='Belum';drawPay();fillLay();['nama','wa','ket'].forEach(i=>$(i).value='');$('ot').textContent='Order baru';
 $('save').textContent='Simpan dan cetak';$('cancel').classList.add('hide');drawItems()}
$('cancel').onclick=resetForm;
$('save').onclick=async()=>{
 const nama=$('nama').value.trim();if(!nama||!ITEMS.length)return toast('Isi nama dan minimal satu layanan');
 let alasan='';if(EDIT){alasan=(prompt('Alasan ralat (wajib):')||'').trim();if(!alasan)return toast('Alasan ralat wajib diisi')}
 const d={nama,wa:$('wa').value.trim(),keterangan:$('ket').value.trim(),bayar:PAY==='Belum'?'Belum':'Lunas',metode:PAY==='Belum'?'':PAY,items:ITEMS.map(i=>({layanan:i.layanan,qty:i.qty}))};
 $('save').disabled=true;
 try{const j=EDIT?await api('ralat',Object.assign(d,{noNota:EDIT,alasan})):await api('simpan',d);
  j.keterangan=d.keterangan;resetForm();showNota(j,true)}
 catch(e){toast(e.message)}finally{$('save').disabled=false}};

// ====== DAFTAR NOTA ======
let T;$('q').oninput=()=>{clearTimeout(T);T=setTimeout(loadList,400)};$('fs').onchange=loadList;
async function loadList(){
 if(USER.role==='owner'&&!$('fs').querySelector('[value=Dihapus]'))$('fs').insertAdjacentHTML('beforeend','<option value="Dihapus">Dihapus</option>');
 try{const rows=(await api('pesanan',{q:$('q').value.trim(),status:$('fs').value})).data;
  $('list').innerHTML=rows.length?rows.map((r,i)=>`<div class="card" data-i="${i}" style="cursor:pointer"><div class="row" style="align-items:center"><b>${esc(r.nama)}</b><b class="r">${rp(r.total)}</b></div>
   <div class="mu">${r.noNota} - ${r.tanggal}</div><div style="margin-top:4px"><span class="bd ${r.status==='Dihapus'?'x':''}">${r.status}</span><span class="bd ${r.bayar==='Lunas'?'':'w'}">${r.bayar==='Lunas'?'Lunas'+(r.metode?' '+r.metode:''):'Belum lunas'}</span></div></div>`).join(''):'<p class="mu">Belum ada nota.</p>';
  $('list')._rows=rows}catch(e){toast(e.message)}}
$('list').onclick=e=>{const c=e.target.closest('[data-i]');if(c)detail($('list')._rows[+c.dataset.i])};

async function detail(r){
 try{const items=(await api('detail',{noNota:r.noNota})).data;const n=Object.assign({},r,{items});
  const own=USER.role==='owner',del=r.status==='Dihapus';
  modal(`<h2>${esc(r.nama)}</h2><div class="mu">${r.noNota} - ${r.tanggal}${r.wa?' - '+esc(r.wa):''}</div>
  <div style="margin:8px 0">${items.map(i=>`<div class="li"><div>${esc(i.layanan)}<div class="mu">${num(i.qty)} ${i.satuan} x ${rp(i.harga)}</div></div><div>${rp(i.subtotal)}</div></div>`).join('')}</div>
  ${r.keterangan?`<div class="mu">Catatan: ${esc(r.keterangan)}</div>`:''}
  <div class="tot"><span>Total</span><span>${rp(r.total)}</span></div>
  ${own&&!del?`<div class="mu">Status</div><div class="row" style="margin:4px 0 8px;flex-wrap:wrap">${['Diterima','Proses','Selesai','Diambil'].map(s=>`<button class="${r.status===s?'on':''}" data-s="${s}">${s}</button>`).join('')}</div>
  <div class="mu">Pembayaran</div><div class="row" style="margin:4px 0 8px"><button data-b="Belum" class="${r.bayar!=='Lunas'?'on':''}">Belum</button><button data-b="Lunas" data-m="Cash" class="${r.bayar==='Lunas'&&r.metode!=='QRIS'?'on':''}">Lunas Cash</button><button data-b="Lunas" data-m="QRIS" class="${r.bayar==='Lunas'&&r.metode==='QRIS'?'on':''}">Lunas QRIS</button></div>`:''}
  ${del?(own?'<button data-act="pulih" style="width:100%">Pulihkan nota</button>':''):`<div class="row" style="margin-bottom:8px"><button data-act="cetak">Cetak</button><button data-act="wa">Kirim WA</button></div>
  <div class="row"><button data-act="ralat">Ralat</button><button class="dng" data-act="hapus">Hapus</button></div>`}
  <button data-act="tutup" style="width:100%;margin-top:8px;border-color:var(--ln);color:var(--mu)">Tutup</button>`);
  $('mbox').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
   try{
    if(b.dataset.s){await api('status',{noNota:r.noNota,value:b.dataset.s});toast('Status: '+b.dataset.s);closeModal();loadList()}
    else if(b.dataset.b){await api('bayar',{noNota:r.noNota,value:b.dataset.b,metode:b.dataset.m||''});toast('Pembayaran diperbarui');closeModal();loadList()}
    else switch(b.dataset.act){
     case'tutup':closeModal();break;
     case'cetak':cetak(n);break;
     case'wa':kirimWA(n);break;
     case'ralat':EDIT=r.noNota;$('nama').value=r.nama;$('wa').value=r.wa||'';$('ket').value=r.keterangan||'';
      ITEMS=items.map(i=>({layanan:i.layanan,jenis:i.jenis,satuan:i.satuan,harga:i.harga,qty:i.qty}));PAY=r.bayar==='Lunas'?(r.metode==='QRIS'?'QRIS':'Cash'):'Belum';drawPay();
      $('ot').textContent='Ralat nota '+r.noNota;$('save').textContent='Simpan ralat';$('cancel').classList.remove('hide');
      drawItems();closeModal();show('order');break;
     case'hapus':{const a=(prompt('Alasan hapus nota (wajib):')||'').trim();if(!a)return toast('Alasan wajib diisi');
      if(!confirm('Hapus nota '+r.noNota+'? Owner akan diberi tahu.'))return;
      await api('hapus',{noNota:r.noNota,alasan:a});toast('Nota dihapus, owner sudah diberi tahu');closeModal();loadList();break}
     case'pulih':await api('pulihkan',{noNota:r.noNota});toast('Nota dipulihkan');closeModal();loadList();break}
   }catch(err){toast(err.message)}}
 }catch(e){toast(e.message)}}

// ====== DASHBOARD & PENGELUARAN (owner) ======
async function loadDash(){try{const d=(await api('dashboard')).data;
 const c=(t,v,s,w)=>`<div class="card ${w?'wide':''}"><span class="mu">${t}</span><b>${v}</b>${s?`<span class="mu">${s}</span>`:''}</div>`;
 $('dash').innerHTML=c('Omset hari ini',rp(d.omsetHariIni),d.orderHariIni+' nota')+c('Uang masuk hari ini',rp(d.uangMasukHariIni),'sudah lunas')+
  c('Cucian hari ini',num(d.kgHariIni)+' Kg',d.pcsHariIni+' pcs/pasang',1)+
  c('Omset bulan ini',rp(d.omsetBulanIni),d.orderBulanIni+' nota')+c('Pengeluaran bulan ini',rp(d.pengeluaranBulanIni))+
  c('Laba bulan ini (omset - pengeluaran)',rp(d.labaBulanIni),'',1)+
  c('Belum lunas',d.belumLunasJumlah+' nota',rp(d.belumLunasNominal))+c('Belum selesai',d.belumSelesai+' nota',d.belumDiambil+' selesai, belum diambil')
 }catch(e){toast(e.message)}}
async function loadKeluar(){try{const d=(await api('pengeluaran')).data;$('ktot').textContent=rp(d.total);
 $('kkl').innerHTML=d.kategori.map(k=>`<option value="${esc(k)}">`).join('');
 $('klist').innerHTML=d.rows.length?d.rows.map(r=>`<div class="card"><div class="row"><b>${esc(r.kategori)}</b><b class="r">${rp(r.jumlah)}</b></div><div class="mu">${r.tanggal} - ${esc(r.keterangan)} (${esc(r.oleh)})</div><a href="#" data-x="${r.id}" style="color:var(--rd);font-size:13px">hapus</a></div>`).join(''):'<p class="mu">Belum ada pengeluaran bulan ini.</p>'}catch(e){toast(e.message)}}
$('ksave').onclick=async()=>{try{await api('pengeluaranTambah',{kategori:$('kk').value.trim(),keterangan:$('kd').value.trim(),jumlah:$('kj').value,tanggal:$('kt').value});
 ['kk','kd','kj'].forEach(i=>$(i).value='');toast('Pengeluaran dicatat');loadKeluar()}catch(e){toast(e.message)}};
$('klist').onclick=async e=>{if(!e.target.dataset.x)return;e.preventDefault();if(!confirm('Hapus pengeluaran ini?'))return;
 try{await api('pengeluaranHapus',{id:e.target.dataset.x});loadKeluar()}catch(err){toast(err.message)}};

// ====== NOTA: GAMBAR, CETAK, WA ======
const HARI=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
function jamLayanan(nm){return /express/i.test(nm)?4:/one\s*day/i.test(nm)?24:72}
function estimasi(n){const m=/(\d+)\/(\d+)\/(\d+) (\d+):(\d+)/.exec(n.tanggal||'');if(!m||!n.items.length)return '-';
 const h=Math.max.apply(null,n.items.map(i=>jamLayanan(i.layanan))),d=new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]+h*60),p=v=>('0'+v).slice(-2);
 return HARI[d.getDay()]+', '+p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())}
function renderNota(n,s,pr){
 const W=384,run=(cv)=>{const x=cv.getContext('2d');x.scale(s,s);x.fillStyle='#fff';x.fillRect(0,0,W,4000);x.fillStyle='#000';x.textBaseline='top';
  let y=6;const f=(z,b)=>x.font=(b?'700 ':'400 ')+z+'px system-ui,Roboto,Arial,sans-serif';
  const t=(a,px,al)=>{x.textAlign=al;x.fillText(a,px,y)};
  const wrap=(a,z,b,mw)=>{f(z,b);const o=[];let l='';a.split(' ').forEach(w=>{const c=l?l+' '+w:w;if(x.measureText(c).width>mw&&l){o.push(l);l=w}else l=c});o.push(l);return o};
  const mid=(a,z,b,lh)=>wrap(a,z,b,W-24).forEach(l=>{f(z,b);t(l,W/2,'center');y+=lh});
  const left=(a,z,b,lh)=>wrap(a,z,b,W-20).forEach(l=>{f(z,b);t(l,10,'left');y+=lh});
  const row=(l,r,z,b,lh)=>{f(z,b);t(l,10,'left');t(r,W-10,'right');y+=lh};
  const dash=()=>{y+=2;x.save();x.setLineDash([3,3]);x.lineWidth=1;x.strokeStyle='#000';x.beginPath();x.moveTo(10,y);x.lineTo(W-10,y);x.stroke();x.restore();y+=6};
  const L=pr?LOGOP:LOGO;if(L.complete&&L.naturalWidth){const lw=132;x.drawImage(L,(W-lw)/2,y,lw,lw);y+=lw+2}
  if(pr)mid(CFG.tagline,11,1,14);mid(CFG.alamat,12,0,15);mid(CFG.wa,12,0,15);dash();
  row('No',n.noNota,12,0,16);row('Masuk',n.tanggal,12,0,16);row('Estimasi',estimasi(n),12,1,16);row('Nama',n.nama,13,1,17);
  if(n.keterangan)left('Ket: '+n.keterangan,12,0,15);dash();
  n.items.forEach(i=>{const sub=i.subtotal!=null?i.subtotal:Math.round(i.qty*i.harga);
   f(13,1);const nm=wrap(i.layanan,13,1,W-95);nm.forEach((l,k)=>{f(13,1);t(l,10,'left');if(k===0){t(Number(sub).toLocaleString('id-ID'),W-10,'right')}y+=16});
   row(num(i.qty)+' '+(i.satuan||'')+' x '+Number(i.harga).toLocaleString('id-ID'),'',11,0,14)});
  dash();row('TOTAL',rp(n.total),17,1,22);row('Bayar',n.bayar==='Lunas'?'LUNAS - '+(n.metode||'Cash').toUpperCase():'BELUM LUNAS',13,1,18);dash();
  left('Ketentuan komplain:',11,1,13);left(CFG.komplain,11,0,13);y+=3;left(CFG.saran,11,0,13);y+=4;
  mid(CFG.tutup,11,1,13);return y+8};
 const tmp=document.createElement('canvas');tmp.width=W*s;tmp.height=4000*s;const H=Math.ceil(run(tmp));
 const cv=document.createElement('canvas');cv.width=W*s;cv.height=H*s;run(cv);return cv}

function rasterBytes(src){ // canvas -> ESC/POS (384 titik, 48 byte per baris)
 const W=384,H=Math.round(src.height*W/src.width),c=document.createElement('canvas');c.width=W;c.height=H;
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(src,0,0,W,H);
 const d=x.getImageData(0,0,W,H).data,wb=W/8,o=[0x1b,0x40];
 for(let y0=0;y0<H;y0+=128){const hh=Math.min(128,H-y0);o.push(0x1d,0x76,0x30,0,wb&255,wb>>8,hh&255,hh>>8);
  for(let y=y0;y<y0+hh;y++)for(let b=0;b<wb;b++){let v=0;for(let k=0;k<8;k++){const i=(y*W+b*8+k)*4;if(d[i]*.3+d[i+1]*.59+d[i+2]*.11<165)v|=0x80>>k}o.push(v)}}
 o.push(0x1b,0x64,2);return o}
function cetak(n){
 try{const bytes=rasterBytes(renderNota(n,2,true));let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.slice(i,i+8192));
  location.href='intent:base64,'+btoa(bin)+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;'}
 catch(e){toast('Gagal menyiapkan cetakan: '+e.message)}}
function waNum(w){let d=String(w||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return d}
async function kirimWA(n){
 try{const c=renderNota(n,2),blob=await new Promise(r=>c.toBlob(r,'image/png')),file=new File([blob],n.noNota+'.png',{type:'image/png'});
  const text='Halo '+n.nama+', berikut nota Laundry Tetangga ('+n.noNota+'). Total '+rp(n.total)+'. Estimasi selesai: '+estimasi(n)+'. Terima kasih!';
  if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],text});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n.noNota+'.png';a.click();
   toast('Foto nota tersimpan. Lampirkan manual di chat WA.');if(n.wa)window.open('https://wa.me/'+waNum(n.wa)+'?text='+encodeURIComponent(text))}}
 catch(e){if(e.name!=='AbortError')toast(e.message)}}
